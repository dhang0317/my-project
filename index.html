<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>法文閱讀器</title>
  <link rel="stylesheet" href="css/styles.css?v=4" />
</head>
<body>

  <!-- 極簡頂部工具列（純文字按鈕，無任何 emoji 或圖示） -->
  <header class="top-bar">
    <div class="bar-left">
      <select id="article-select" class="select-box" aria-label="選擇文章"></select>
    </div>
    <div class="bar-right">
      <button id="open-upload-btn" type="button" class="btn btn-main">上傳文章</button>
      <button id="font-btn" type="button" class="btn">字級</button>
      <button id="theme-btn" type="button" class="btn">深色</button>
    </div>
  </header>

  <!-- 純淨法文閱讀主體（100% 只有法文，無任何中文提示與多餘按鈕） -->
  <main class="reading-area">
    <article class="reading-card">
      <h1 id="article-title" class="article-title"></h1>
      <div id="article-body" class="article-content"></div>
    </article>
  </main>

  <!-- 穩定固定在螢幕最下方（永遠置底、不漂浮、不晃動、不被 iPad 選單遮擋） -->
  <footer id="bottom-dock" class="fixed-bottom-bar">
    <div class="dock-container">
      <div class="dock-left">
        <div class="dock-row">
          <span id="dock-fr" class="dock-fr-word">選取法文文字</span>
          <span id="dock-lemma" class="dock-tag" style="display: none;"></span>
          <span id="dock-pos" class="dock-subtag" style="display: none;"></span>
        </div>
        <div id="dock-zh" class="dock-zh-meaning">點擊單字或反白文字即在此顯示翻譯</div>
      </div>
      <div class="dock-right">
        <button id="dock-translate-btn" type="button" class="btn btn-main" style="display: none;">翻譯選取</button>
      </div>
    </div>
  </footer>

  <!-- 上傳文章彈窗（純文字極簡設計） -->
  <div id="upload-modal" class="modal-layer">
    <div class="modal-card">
      <div class="modal-top">
        <h3>上傳法文文章</h3>
        <button id="close-upload-btn" type="button" class="btn">關閉</button>
      </div>
      <div class="modal-content">
        <div style="margin-bottom: 12px;">
          <input id="file-input" type="file" accept=".txt,.md,text/plain" style="margin-bottom: 8px; font-size: 14px;" />
        </div>
        <input id="input-title" type="text" class="input-text" placeholder="文章標題（選填）" />
        <textarea id="input-content" class="input-area" placeholder="在此貼上法文內文..."></textarea>
        <button id="save-article-btn" type="button" class="btn btn-main" style="width: 100%; padding: 12px; margin-top: 10px;">確認儲存並開始閱讀</button>
      </div>
    </div>
  </div>

  <script src="js/french-analyzer.js?v=5"></script>
  <script src="js/app.js?v=5"></script>
</body>
</html>
